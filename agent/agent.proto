}
message ListGrantsResp {
  string creatorID = 1;
  bool creatorValid = 2;          // 创建者是员工所在企业的在职成员
  repeated AgentGrant grants = 3; // 维护负责人在前，再按授予时间
}

// 设编辑者：没有就加，有就覆盖动作
message SetEditorReq {
  string agentID = 1;
  string userID = 2;
  repeated GrantAction actions = 3; // 编辑、测试、提交，至少一项
  string reason = 4;                // 必填，≤200 字
}
message SetEditorResp {
  AgentGrant grant = 1;
  bool changed = 2; // false 表示动作和原来一样，没有改
}

message RemoveEditorReq {
  string agentID = 1;
  string userID = 2;
  string reason = 3; // 必填，≤200 字
}
message RemoveEditorResp {
  bool removed = 1; // false 表示本来就不是编辑者
}

// 授权给我的：我在当前企业有授权、状态正常的员工
message ListGrantedAgentsReq {
  string keyword = 1;
  sdkws.RequestPagination pagination = 2;
}
message ListGrantedAgentsResp {
  int64 total = 1;
  repeated AgentListItem agents = 2;
}

message ListTemplatesReq {
  TemplateCategory category = 1;
  string keyword = 2;
  sdkws.RequestPagination pagination = 3;
}
message ListTemplatesResp {
  int64 total = 1;
  repeated AgentTemplate templates = 2;
}

message GetTemplateReq {
  string templateID = 1;
}
message GetTemplateResp {
  AgentTemplate template = 1;
}

message ListTagsReq {}
message ListTagsResp {
  repeated AgentTag tags = 1;
}

// 当前用户能不能用这个员工、用哪个版本
message GetEligibilityReq {
  string agentID = 1;
}
message GetEligibilityResp {
  Eligibility eligibility = 1;
  AgentProfile profile = 2; // 能用或需要申请时才有
}

message ListVersionsReq {
  string agentID = 1;
  sdkws.RequestPagination pagination = 2;
}
message ListVersionsResp {
  int64 total = 1;
  repeated VersionItem versions = 2;       // 新的在前
  repeated AvatarChange avatarChanges = 3; // 最近 50 次，新的在前
}

// 草稿或某个快照，和某个范围当前实际在用的配置（生效快照减去当前限制）比
message DiffVersionReq {
  string agentID = 1;
  string snapshotID = 2;  // 空表示比草稿
  int64 revision = 3;     // 比草稿时必须是当前草稿的修订号
  ReleaseScope scope = 4; // 企业或平台；不传按配置里的发布目标
}
message DiffVersionResp {
  bool empty = 1; // 这个范围还没有生效版本，不比
  string message = 2;
  ReleaseScope scope = 3;
  string baseSnapshotID = 4;
  int64 baseRevision = 5;
  repeated DiffItem items = 6; // 已生效的收紧在前
  bool needRetest = 7;
  bool needReview = 8;
  bool narrowOnly = 9; // 只有收紧和换处理人，可以立即生效
}

message SubmitReviewReq {
  string agentID = 1;
  int64 revision = 2;   // 必须是当前草稿的修订号
  string requestID = 3; // 必填，≤64 字；重复请求拿到同一张单
  string note = 4;      // ≤500 字
}
message SubmitReviewResp {
  bool passed = 1; // 检查有阻断时为 false，不建单
  repeated CheckResult checks = 2;
  ReviewInfo review = 3;
  NarrowingResult narrowing = 4; // 收紧先生效的结果；没有收紧时为空
}

// 只有提交人能撤，单子要还是待审核
message WithdrawReviewReq {
  string agentID = 1;
  string reviewID = 2;
  string reason = 3; // 可不填，≤200 字
}
message WithdrawReviewResp {
  ReviewInfo review = 1;
}

message ListReviewsReq {
  string agentID = 1;
  sdkws.RequestPagination pagination = 2;
}
message ListReviewsResp {
  int64 total = 1;
  repeated ReviewInfo reviews = 2; // 新的在前
}

message GetReviewReq {
  string agentID = 1;
  string reviewID = 2;
}
message GetReviewResp {
  ReviewInfo review = 1;
  UsageSetting usage = 2; // 快照里的范围、群使用、维护负责人、处理人
  repeated CapabilityRef capabilities = 3;
  ServiceBinding service = 4;
  reserved 5;
  reserved "modelID";
  repeated KnowledgeMeta knowledge = 6; // 按查看人裁剪
  repeated ReviewTest tests = 7;        // 有效测试：行为指纹和快照一样的
}

// 重试生效失败、或换上以后没写完的单；不重审
message RetryReviewReq {
  string agentID = 1;
  string reviewID = 2;
}
message RetryReviewResp {
  ReviewInfo review = 1;
}

// 把草稿里相对实际在用配置的收紧和换处理人立即生效
message RestrictReleaseReq {
  string agentID = 1;
  ReleaseScope scope = 2; // 这批只能是企业
  int64 revision = 3;     // 必须是当前草稿的修订号
  string requestID = 4;   // 必填，≤64 字
}
message RestrictReleaseResp {
  bool applied = 1;            // false：没有需要立即生效的收紧
  repeated DiffItem items = 2; // 这次立即生效的项
  ReleaseInfo release = 3;
  string message = 4;
}

// ==================== 范围与人员群体 ====================

// 公共范围：全员，或者命中任一部门、人员群体、指定人员。只算所属企业在职的人，全员也是指本企业全员
message Scope {
  bool all = 1;
  repeated ScopeDepartment departments = 2; // ≤500
  repeated string groupIDs = 3;             // 人员群体，≤50
  repeated string userIDs = 4;              // ≤2000
}

message ScopeDepartment {
  string departmentID = 1;
  bool excludeSub = 2; // 不含下级部门，默认含
}

// 人员群体的一条规则：部门、职位之间是「且」，同一维度的多个值之间是「或」。
// 不填的维度不限，但至少要填一个
message PeopleRule {
  reserved 1;
  reserved "companyIDs";                    // 群体按企业分，不再有公司这一维
  repeated ScopeDepartment departments = 2; // 本企业的部门
  repeated string jobs = 3;                 // 职位名称，命中时只算本企业的人
}

// 人员群体属于一个企业，只有本企业能看、能改、能引用。成员是命中任一规则的人加上指定人员，只算本企业在职的。
// 所有规则合起来部门 ≤500、职位 ≤500
message PeopleGroup {
  string groupID = 1;            // 新建时留空
  string name = 2;               // 1-30 字，企业内不能重名
  string description = 3;        // ≤200 字
  repeated PeopleRule rules = 4; // ≤20 条
  repeated string userIDs = 5;   // 指定人员，≤2000；列表接口不返回
  int64 revision = 6;            // 保存时带上读到的值，和库里不一样就报冲突
  string createdBy = 7;
  string updatedBy = 8;
  int64 createTime = 9;
  int64 updateTime = 10;
  int32 userCount = 11;          // 指定人员数，含已离职的
  int64 memberCount = 12;        // 在职成员数
  string companyID = 13;         // 所属企业，建的时候取操作人的企业，之后不能改；保存时忽略
}

// 已选对象的显示名称
message ScopeName {
  ScopeItemType type = 1;
  string id = 2;
  string name = 3;           // 找不到的为空
  bool invalid = 4;          // 已失效：找不到、不是本企业的、已撤销、人已离职或封禁、职位名已没有对应的职位
  string companyID = 5;      // 部门、人员才有
  string departmentName = 6; // 人员才有
  string faceURL = 7;        // 人员才有
}

// 选择器的候选项
message ScopeOption {
  ScopeItemType type = 1;
  string id = 2;
  string name = 3;
  string companyID = 4;      // 部门、人员才有
  bool hasChildren = 5;      // 部门才有：有没有下级部门
  int64 memberCount = 6;     // 人员群体才有：在职成员数
  string departmentName = 7; // 人员才有
  string faceURL = 8;        // 人员才有
}

message PeopleGroupMember {
  string userID = 1;
  string name = 2;
  string faceURL = 3;
  string companyID = 4;
  string departmentName = 5;
  bool named = 6;   // 指定加入
  bool matched = 7; // 规则命中
}

// 某人所在的人员群体
message UserPeopleGroup {
  string groupID = 1;
  string name = 2;
  bool named = 3;   // 指定加入
  bool matched = 4; // 规则命中，已离职的人不算
}

// 引用人员群体的对象
message PeopleGroupRef {
  string kind = 1; // 引用方类别
  string id = 2;
  string name = 3;
}

// 用户端：只解析本人所在企业的部门、人员；别的企业的标为失效，不给名称
message DescribeScopeReq {
  repeated string departmentIDs = 1;
  repeated string groupIDs = 2;
  repeated string userIDs = 3;
}
message DescribeScopeResp {
  repeated ScopeName names = 1;
}

// 用户端：人员群体候选，人数只算本企业的。部门和人员用客户端的组织选择器
message ScopeOptionsReq {
  string keyword = 1;
  sdkws.RequestPagination pagination = 2;
}
message ScopeOptionsResp {
  int64 total = 1;
  repeated ScopeOption options = 2;
}

// ==================== 后台 ====================

message AdminGetCompanySettingReq {
  string companyID = 1;
}
message AdminGetCompanySettingResp {
  CompanySettingInfo setting = 1;
}

message AdminSetCompanySettingReq {
  string companyID = 1;
  openim.protobuf.BoolValue enabled = 2;
  CreatorScope creatorScope = 3; // 为空时不改
  AgentLimits limits = 4;        // 为空时不改
  reserved 5, 6;
  reserved "modelIDs", "modelIDsSet";
}
message AdminSetCompanySettingResp {}

message AdminListCompanySettingsReq {
  sdkws.RequestPagination pagination = 1;
}
message AdminListCompanySettingsResp {
  int64 total = 1;
  repeated CompanySettingInfo settings = 2;
}

// 平台公共的能力，给模板选
message AdminListCapabilitiesReq {
  CapabilityType type = 1;
  string keyword = 2;
  sdkws.RequestPagination pagination = 3;
}
message AdminListCapabilitiesResp {
  int64 total = 1;
  repeated CapabilityItem items = 2;
}

message AdminListTemplatesReq {
  TemplateCategory category = 1;
  string keyword = 2;
  sdkws.RequestPagination pagination = 3;
}
message AdminListTemplatesResp {
  int64 total = 1;
  repeated AgentTemplate templates = 2;
}

message AdminSaveTemplateReq {
  AgentTemplate template = 1;
}
message AdminSaveTemplateResp {
  string templateID = 1;
}

message AdminDeleteTemplateReq {
  string templateID = 1;
}
message AdminDeleteTemplateResp {}

message AdminListTagsReq {}
message AdminListTagsResp {
  repeated AgentTag tags = 1;
}

message AdminSaveTagReq {
  AgentTag tag = 1;
}
message AdminSaveTagResp {
  string tagID = 1;
}

message AdminDeleteTagReq {
  string tagID = 1;
}
message AdminDeleteTagResp {}

message AdminListAgentsReq {
  string companyID = 1;
  AgentStatus status = 2;
  string createdBy = 3;
  string keyword = 4;
  sdkws.RequestPagination pagination = 5;
}
message AdminListAgentsResp {
  int64 total = 1;
  repeated AgentListItem agents = 2;
}

// 停用记在平台这一层。ownerID 为空时：本人取创建者，企业取员工所属企业
message AdminDisableAgentReq {
  string agentID = 1;
  ReleaseScope scope = 2;
  string ownerID = 3;
  string reason = 4; // 必填，≤200 字
}
message AdminDisableAgentResp {
  string note = 1; // 停的是新的调用，正在进行的答复会跑完
}

message AdminEnableAgentReq {
  string agentID = 1;
  ReleaseScope scope = 2;
  string ownerID = 3;
}
message AdminEnableAgentResp {
  bool cleared = 1;
  bool stillDisabled = 2;
  repeated CheckIssue issues = 3;
}

// 范围管理者那层（第 2 层），只限企业版。操作人要是员工所在企业的企业负责人
message AdminScopeDisableAgentReq {
  string agentID = 1;
  ReleaseScope scope = 2; // 只能是企业
  reserved 3;
  reserved "operatorUserID";
  string reason = 4; // 必填，≤200 字
}
message AdminScopeDisableAgentResp {
  string note = 1;
}

message AdminScopeEnableAgentReq {
  string agentID = 1;
  ReleaseScope scope = 2;
  reserved 3;
  reserved "operatorUserID";
}
message AdminScopeEnableAgentResp {
  bool cleared = 1;
  bool stillDisabled = 2;
  repeated CheckIssue issues = 3;
}

message AdminRestoreAgentReq {
  string agentID = 1;
}
message AdminRestoreAgentResp {
  AgentInfo agent = 1;
  repeated CheckIssue issues = 2;
}

message AuditFilter {
  string companyID = 1;
  string agentID = 2;
  AuditCategory category = 3;
  string action = 4;
  AuditResult result = 5;
  string operatorID = 6;
  int64 startTime = 7; // 毫秒，含
  int64 endTime = 8;   // 毫秒，不含
}

message AdminListAuditsReq {
  AuditFilter filter = 1;
  sdkws.RequestPagination pagination = 2;
}
message AdminListAuditsResp {
  int64 total = 1;
  repeated AuditLog logs = 2;
}

// 最多 1 万条，表格由前端生成
message AdminExportAuditsReq {
  AuditFilter filter = 1;
}
message AdminExportAuditsResp {
  repeated AuditLog logs = 1;
  bool truncated = 2;
}

// 发布目标是操作人企业的审核单，新的在前
message AdminListReviewsReq {
  repeated ReviewStatus statuses = 1; // 不传只列待审核
  string agentID = 2;                 // 可不填
  sdkws.RequestPagination pagination = 3;
}
message AdminReviewItem {
  ReviewInfo review = 1; // 不带检查项
  string agentName = 2;
  string agentAvatar = 3;
}
message AdminListReviewsResp {
  int64 total = 1;
  repeated AdminReviewItem reviews = 2;
}

// 详情，内容同用户端的 getReview，知识按操作人裁剪
message AdminGetReviewReq {
  string reviewID = 1;
}
message AdminGetReviewResp {
  GetReviewResp detail = 1;
  string agentName = 2;
  string agentAvatar = 3;
  bool decidable = 4; // 操作人现在能做决定：单子待审核，操作人在单上的审核人名单里、现在仍是企业负责人
}

// 通过或退回，只有企业负责人能做。可以审本人提交的，标「本人提交」
message AdminDecideReviewReq {
  string reviewID = 1;
  bool approve = 2;
  string reason = 3; // 退回必填，≤200 字
}
message AdminDecideReviewResp {
  ReviewInfo review = 1;
}

// 选择器的候选项，只列操作人企业的。职位、人员群体按 keyword 搜名称；
// 部门：不带 keyword 时列 parentID 的下级，parentID 空为顶层，带了在整个企业里搜；
// 人员：按姓名、账号搜，可以限定 departmentID（含下级部门）
message AdminScopeOptionsReq {
  ScopeItemType type = 1;
  reserved 2;
  reserved "companyID";
  string parentID = 3;     // 部门才用
  string departmentID = 4; // 人员才用
  string keyword = 5;
  sdkws.RequestPagination pagination = 6;
}
message AdminScopeOptionsResp {
  int64 total = 1;
  repeated ScopeOption options = 2;
}

// 每种最多 2000 个，重复的只返回一次。别的企业的部门、人员、群体标为失效，不给名称
message AdminDescribeScopeReq {
  reserved 1;
  reserved "companyIDs";
  repeated string departmentIDs = 2;
  repeated string jobs = 3;
  repeated string groupIDs = 4;
  repeated string userIDs = 5;
}
message AdminDescribeScopeResp {
  repeated ScopeName names = 1;
}

message AdminListPeopleGroupsReq {
  string keyword = 1; // 搜名称
  sdkws.RequestPagination pagination = 2;
}
message AdminListPeopleGroupsResp {
  int64 total = 1;
  repeated PeopleGroup groups = 2; // 不带 userIDs
}

message AdminGetPeopleGroupReq {
  string groupID = 1;
}
message AdminGetPeopleGroupResp {
  PeopleGroup group = 1;
}

// 在职成员，按 userID 排
message AdminListPeopleGroupMembersReq {
  string groupID = 1;
  reserved 2;
  reserved "companyID";
  string keyword = 3; // 搜姓名、账号
  sdkws.RequestPagination pagination = 4;
}
message AdminListPeopleGroupMembersResp {
  int64 total = 1;
  repeated PeopleGroupMember members = 2;
}

message AdminListUserPeopleGroupsReq {
  string userID = 1;
}
message AdminListUserPeopleGroupsResp {
  repeated UserPeopleGroup groups = 1;
}

// groupID 空是新建。名称、描述、规则、指定人员整体替换；新加的人要在职
message AdminSavePeopleGroupReq {
  PeopleGroup group = 1;
}
message AdminSavePeopleGroupResp {
  string groupID = 1;
  int64 revision = 2;
}

// 还被引用时不删，deleted 为 false，refs 列出引用方
message AdminDeletePeopleGroupReq {
  string groupID = 1;
}
message AdminDeletePeopleGroupResp {
  bool deleted = 1;
  repeated PeopleGroupRef refs = 2;
}

// 加进指定人员，已经在的跳过；新加的要在职
message AdminAddPeopleGroupUsersReq {
  string groupID = 1;
  repeated string userIDs = 2;
}
message AdminAddPeopleGroupUsersResp {
  int64 revision = 1;
}

// 只从指定人员里去掉；还被规则命中的仍是成员，列在 stillMatched 里
message AdminRemovePeopleGroupUsersReq {
  string groupID = 1;
  repeated string userIDs = 2;
}
message AdminRemovePeopleGroupUsersResp {
  int64 revision = 1;
  repeated string stillMatched = 2;
}

// ==================== AI 配置（每个企业一份） ====================

// 模型提供商。服务端不存 key，使用者在自己电脑上填
message AIProvider {
  string providerID = 1;  // 新建时留空
  string name = 2;        // 1-50 字，企业内不能重名
  string api = 3;         // API 协议，和 OpenClaw 的 api 一致：openai-completions、openai-responses、anthropic-messages、google-generative-ai
  string baseURL = 4;     // 端点，http 或 https；保存时去掉末尾的调用路径，没有路径的补上版本路径
  string keyGuide = 5;    // Key 获取指引，≤2000 字
  string keyGuideURL = 6; // 获取 key 的网址，可不填
  Scope visibleScope = 7; // 可见范围，列表不带；还要在 AI 使用范围内才看得到
  bool enabled = 8;
  int32 sort = 9;         // 小的在前；保存时忽略，用排序接口改
  int64 revision = 10;    // 修改时带上读到的值，和库里不一样就报冲突
  string createdBy = 11;
  string updatedBy = 12;
  int64 createTime = 13;
  int64 updateTime = 14;
  int32 modelCount = 15;  // 只读
}

// 提供商下的模型
message AIModel {
  string providerID = 1;
  string modelID = 2;                   // 调用时用的模型 ID，1-200 字，不能有空白；建好后不能改
  string name = 3;                      // 显示名，≤50 字，不填用 modelID
  string description = 4;               // ≤500 字
  bool imageInput = 5;                  // 支持图片输入
  AIReasoningMode reasoningMode = 6;    // 不填按不支持
  repeated string reasoningEfforts = 7; // 推理强度候选，≤10 个；不支持推理时不能填
  string defaultReasoningEffort = 8;    // 有候选时必填，要在候选里
  repeated int64 contextWindows = 9;    // 上下文窗口候选（token），1-10 个，每个 1024 到 1000 万
  int64 defaultContextWindow = 10;      // 要在候选里，不填取最大的
  int64 maxOutput = 11;                 // 最大输出（token），不超过最大的上下文窗口
  int32 sort = 12;                      // 保存时忽略，用排序接口改
  int64 revision = 13;                  // 0 表示新建；修改时带上读到的值
  string updatedBy = 14;
  int64 createTime = 15;
  int64 updateTime = 16;
}

message AIModelRef {
  string providerID = 1;
  string modelID = 2;
}

// AI 使用权限和企业默认模型。没设置过时 AI 关着，谁都不能用
message AISetting {
  bool enabled = 1;
  Scope usageScope = 2;        // AI 使用范围
  AIModelRef defaultModel = 3; // 企业默认模型，新用户默认用它；可为空
  int64 revision = 4;          // 没设置过为 0
  string updatedBy = 5;
  int64 updateTime = 6;
}

// 用户端看到的提供商，不含 key
message AIProviderView {
  string providerID = 1;
  string name = 2;
  string api = 3;
  string baseURL = 4;
  string keyGuide = 5;
  string keyGuideURL = 6;
  repeated AIModelView models = 7; // 按排序
}

message AIModelView {
  string modelID = 1;
  string name = 2;
  string description = 3;
  bool imageInput = 4;
  AIReasoningMode reasoningMode = 5;
  repeated string reasoningEfforts = 6;
  string defaultReasoningEffort = 7;
  repeated int64 contextWindows = 8;
  int64 defaultContextWindow = 9;
  int64 maxOutput = 10;
}

// 用户端，按本人现算：AI 开着、本人在 AI 使用范围内才有提供商；提供商要启用、本人在它的可见范围内。
// 登录、重连、收到 ai.config.changed 时拉；revision 没变就不用处理
message GetAIConfigReq {}
message GetAIConfigResp {
  bool aiEnabled = 1;
  repeated AIProviderView providers = 2; // 按排序
  AIModelRef defaultModel = 3;           // 本人看得到这个模型时才给
  string revision = 4;                   // 返回内容的摘要
}

message AdminGetAISettingReq {}
message AdminGetAISettingResp {
  AISetting setting = 1;
}

// 不传的项不改；revision 带上读到的值，和库里不一样就报冲突
message AdminSetAISettingReq {
  openim.protobuf.BoolValue enabled = 1;
  Scope usageScope = 2;        // 整体替换；不传不改
  AIModelRef defaultModel = 3; // 不传不改；两项都空表示清掉。要是启用的提供商下的模型
  int64 revision = 4;
}
message AdminSetAISettingResp {
  int64 revision = 1;
}

message AdminListAIProvidersReq {}
message AdminListAIProvidersResp {
  repeated AIProvider providers = 1; // 按排序，不带可见范围
}

message AdminGetAIProviderReq {
  string providerID = 1;
}
message AdminGetAIProviderResp {
  AIProvider provider = 1;
  repeated AIModel models = 2; // 按排序
}

// providerID 为空是新建，排在最后。名称、协议、端点、指引、可见范围、启用整体替换。
// 停用企业默认模型所在的提供商要先换默认模型
message AdminSaveAIProviderReq {
  AIProvider provider = 1;
}
message AdminSaveAIProviderResp {
  string providerID = 1;
  int64 revision = 2;
  string baseURL = 3; // 补全后的端点
}

// 连同下面的模型一起删；企业默认模型在它下面时不能删
message AdminDeleteAIProviderReq {
  string providerID = 1;
}
message AdminDeleteAIProviderResp {}

// 传入的按顺序排在前面，没传的按原顺序排在后面
message AdminSortAIProvidersReq {
  repeated string providerIDs = 1;
}
message AdminSortAIProvidersResp {}

// revision 为 0 是新建，排在最后
message AdminSaveAIModelReq {
  AIModel model = 1;
}
message AdminSaveAIModelResp {
  int64 revision = 1;
}

// 企业默认模型不能删
message AdminDeleteAIModelReq {
  string providerID = 1;
  string modelID = 2;
}
message AdminDeleteAIModelResp {}

message AdminSortAIModelsReq {
  string providerID = 1;
  repeated string modelIDs = 2;
}
message AdminSortAIModelsResp {}

// 连通性测试：用临时填的 key 发一次最小请求。key 不保存、不写日志、不进审计；
// 端点不能是内网、回环、云元数据等地址（配置的白名单除外），只跟同一主机的重定向
message AdminTestAIProviderReq {
  string api = 1;
  string baseURL = 2;
  string modelID = 3;
  string apiKey = 4; // ≤1000 字
}
message AdminTestAIProviderResp {
  bool ok = 1;
  int64 latencyMS = 2;
  int32 httpStatus = 3;  // 没收到响应时为 0
  string vendorCode = 4; // 厂商返回的错误码，取不到为空
  string errorKind = 5;  // 不通时的类别：auth、not_found、rate_limit、bad_request、server、timeout、network、blocked、redirect、bad_response
}

service Agent {
  // 用户端
  rpc getContext(GetContextReq) returns (GetContextResp);
  rpc createAgent(CreateAgentReq) returns (CreateAgentResp);
  rpc getAgent(GetAgentReq) returns (GetAgentResp);
  rpc listMyAgents(ListMyAgentsReq) returns (ListMyAgentsResp);
  rpc saveDraft(SaveDraftReq) returns (SaveDraftResp);
  rpc restoreDraft(RestoreDraftReq) returns (RestoreDraftResp);
  rpc updateAvatar(UpdateAvatarReq) returns (UpdateAvatarResp);
  rpc deleteAgent(DeleteAgentReq) returns (DeleteAgentResp);
  rpc restoreAgent(RestoreAgentReq) returns (RestoreAgentResp);
  rpc listCapabilities(ListCapabilitiesReq) returns (ListCapabilitiesResp);
  rpc confirmKnowledge(ConfirmKnowledgeReq) returns (ConfirmKnowledgeResp);
  rpc previewRoleImport(PreviewRoleImportReq) returns (PreviewRoleImportResp);
  rpc applyRoleImport(ApplyRoleImportReq) returns (ApplyRoleImportResp);
  rpc listTestRuns(ListTestRunsReq) returns (ListTestRunsResp);
  rpc markTestRun(MarkTestRunReq) returns (MarkTestRunResp);
  rpc selfUse(SelfUseReq) returns (SelfUseResp);
  rpc listReleases(ListReleasesReq) returns (ListReleasesResp);
  rpc getSnapshot(GetSnapshotReq) returns (GetSnapshotResp);
  rpc disableRelease(DisableReleaseReq) returns (DisableReleaseResp);
  rpc enableRelease(EnableReleaseReq) returns (EnableReleaseResp);
  rpc submitCheck(SubmitCheckReq) returns (SubmitCheckResp);
  rpc listGrants(ListGrantsReq) returns (ListGrantsResp);
  rpc setEditor(SetEditorReq) returns (SetEditorResp);
  rpc removeEditor(RemoveEditorReq) returns (RemoveEditorResp);
  rpc listGrantedAgents(ListGrantedAgentsReq) returns (ListGrantedAgentsResp);
  rpc listTemplates(ListTemplatesReq) returns (ListTemplatesResp);
  rpc getTemplate(GetTemplateReq) returns (GetTemplateResp);
  rpc listTags(ListTagsReq) returns (ListTagsResp);
  rpc getEligibility(GetEligibilityReq) returns (GetEligibilityResp);
  rpc listVersions(ListVersionsReq) returns (ListVersionsResp);
  rpc diffVersion(DiffVersionReq) returns (DiffVersionResp);
  rpc submitReview(SubmitReviewReq) returns (SubmitReviewResp);
  rpc withdrawReview(WithdrawReviewReq) returns (WithdrawReviewResp);
  rpc listReviews(ListReviewsReq) returns (ListReviewsResp);
  rpc getReview(GetReviewReq) returns (GetReviewResp);
  rpc retryReview(RetryReviewReq) returns (RetryReviewResp);
  rpc restrictRelease(RestrictReleaseReq) returns (RestrictReleaseResp);
  rpc describeScope(DescribeScopeReq) returns (DescribeScopeResp);
  rpc scopeOptions(ScopeOptionsReq) returns (ScopeOptionsResp);
  rpc getAIConfig(GetAIConfigReq) returns (GetAIConfigResp);

  // 后台：/agent/admin，只能操作本企业的
  rpc adminGetCompanySetting(AdminGetCompanySettingReq) returns (AdminGetCompanySettingResp);
  rpc adminSetCompanySetting(AdminSetCompanySettingReq) returns (AdminSetCompanySettingResp);
  rpc adminListCompanySettings(AdminListCompanySettingsReq) returns (AdminListCompanySettingsResp);
  rpc adminListCapabilities(AdminListCapabilitiesReq) returns (AdminListCapabilitiesResp);
  rpc adminListTemplates(AdminListTemplatesReq) returns (AdminListTemplatesResp);
  rpc adminSaveTemplate(AdminSaveTemplateReq) returns (AdminSaveTemplateResp);
  rpc adminDeleteTemplate(AdminDeleteTemplateReq) returns (AdminDeleteTemplateResp);
  rpc adminListTags(AdminListTagsReq) returns (AdminListTagsResp);
  rpc adminSaveTag(AdminSaveTagReq) returns (AdminSaveTagResp);
  rpc adminDeleteTag(AdminDeleteTagReq) returns (AdminDeleteTagResp);
  rpc adminListAgents(AdminListAgentsReq) returns (AdminListAgentsResp);
  rpc adminDisableAgent(AdminDisableAgentReq) returns (AdminDisableAgentResp);
  rpc adminEnableAgent(AdminEnableAgentReq) returns (AdminEnableAgentResp);
  rpc adminScopeDisableAgent(AdminScopeDisableAgentReq) returns (AdminScopeDisableAgentResp);
  rpc adminScopeEnableAgent(AdminScopeEnableAgentReq) returns (AdminScopeEnableAgentResp);
  rpc adminRestoreAgent(AdminRestoreAgentReq) returns (AdminRestoreAgentResp);
  rpc adminListAudits(AdminListAuditsReq) returns (AdminListAuditsResp);
  rpc adminExportAudits(AdminExportAuditsReq) returns (AdminExportAuditsResp);
  rpc adminListReviews(AdminListReviewsReq) returns (AdminListReviewsResp);
  rpc adminGetReview(AdminGetReviewReq) returns (AdminGetReviewResp);
  rpc adminDecideReview(AdminDecideReviewReq) returns (AdminDecideReviewResp);

  // 后台：范围选择器（/agent/admin/scope、/ai/admin/scope 共用）、人员群体、AI 配置，都只限操作人的企业
  rpc adminDescribeScope(AdminDescribeScopeReq) returns (AdminDescribeScopeResp);
  rpc adminScopeOptions(AdminScopeOptionsReq) returns (AdminScopeOptionsResp);
  rpc adminListPeopleGroups(AdminListPeopleGroupsReq) returns (AdminListPeopleGroupsResp);
  rpc adminGetPeopleGroup(AdminGetPeopleGroupReq) returns (AdminGetPeopleGroupResp);
  rpc adminListPeopleGroupMembers(AdminListPeopleGroupMembersReq) returns (AdminListPeopleGroupMembersResp);
  rpc adminListUserPeopleGroups(AdminListUserPeopleGroupsReq) returns (AdminListUserPeopleGroupsResp);
  rpc adminSavePeopleGroup(AdminSavePeopleGroupReq) returns (AdminSavePeopleGroupResp);
  rpc adminDeletePeopleGroup(AdminDeletePeopleGroupReq) returns (AdminDeletePeopleGroupResp);
  rpc adminAddPeopleGroupUsers(AdminAddPeopleGroupUsersReq) returns (AdminAddPeopleGroupUsersResp);
  rpc adminRemovePeopleGroupUsers(AdminRemovePeopleGroupUsersReq) returns (AdminRemovePeopleGroupUsersResp);
  rpc adminGetAISetting(AdminGetAISettingReq) returns (AdminGetAISettingResp);
  rpc adminSetAISetting(AdminSetAISettingReq) returns (AdminSetAISettingResp);
  rpc adminListAIProviders(AdminListAIProvidersReq) returns (AdminListAIProvidersResp);
  rpc adminGetAIProvider(AdminGetAIProviderReq) returns (AdminGetAIProviderResp);
  rpc adminSaveAIProvider(AdminSaveAIProviderReq) returns (AdminSaveAIProviderResp);
  rpc adminDeleteAIProvider(AdminDeleteAIProviderReq) returns (AdminDeleteAIProviderResp);
  rpc adminSortAIProviders(AdminSortAIProvidersReq) returns (AdminSortAIProvidersResp);
  rpc adminSaveAIModel(AdminSaveAIModelReq) returns (AdminSaveAIModelResp);
  rpc adminDeleteAIModel(AdminDeleteAIModelReq) returns (AdminDeleteAIModelResp);
  rpc adminSortAIModels(AdminSortAIModelsReq) returns (AdminSortAIModelsResp);
  rpc adminTestAIProvider(AdminTestAIProviderReq) returns (AdminTestAIProviderResp);
}
