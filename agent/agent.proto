}
message AdminSaveModelResp {
  string modelID = 1;
}

message AdminDeleteModelReq {
  string modelID = 1;
}
message AdminDeleteModelResp {}

// 只测对话
message AdminTestModelReq {
  string modelID = 1;
}
message AdminTestModelResp {
  bool ok = 1;
  int64 latencyMS = 2;
  string error = 3;
}

// 平台公共的能力，给模板选
message AdminListCapabilitiesReq {
  CapabilityType type = 1;
  string keyword = 2;
  sdkws.RequestPagination pagination = 3;
}
message AdminListCapabilitiesResp {
  int64 total = 1;
  repeated CapabilityItem items = 2;
}

message AdminListTemplatesReq {
  TemplateCategory category = 1;
  string keyword = 2;
  sdkws.RequestPagination pagination = 3;
}
message AdminListTemplatesResp {
  int64 total = 1;
  repeated AgentTemplate templates = 2;
}

message AdminSaveTemplateReq {
  AgentTemplate template = 1;
}
message AdminSaveTemplateResp {
  string templateID = 1;
}

message AdminDeleteTemplateReq {
  string templateID = 1;
}
message AdminDeleteTemplateResp {}

message AdminListTagsReq {}
message AdminListTagsResp {
  repeated AgentTag tags = 1;
}

message AdminSaveTagReq {
  AgentTag tag = 1;
}
message AdminSaveTagResp {
  string tagID = 1;
}

message AdminDeleteTagReq {
  string tagID = 1;
}
message AdminDeleteTagResp {}

message AdminListAgentsReq {
  string companyID = 1;
  AgentStatus status = 2;
  string createdBy = 3;
  string keyword = 4;
  sdkws.RequestPagination pagination = 5;
}
message AdminListAgentsResp {
  int64 total = 1;
  repeated AgentListItem agents = 2;
}

// 停用记在平台这一层。ownerID 为空时：本人取创建者，企业取员工所属企业
message AdminDisableAgentReq {
  string agentID = 1;
  ReleaseScope scope = 2;
  string ownerID = 3;
  string reason = 4; // 必填，≤200 字
}
message AdminDisableAgentResp {
  string note = 1; // 停的是新的调用，正在进行的答复会跑完
}

message AdminEnableAgentReq {
  string agentID = 1;
  ReleaseScope scope = 2;
  string ownerID = 3;
}
message AdminEnableAgentResp {
  bool cleared = 1;
  bool stillDisabled = 2;
  repeated CheckIssue issues = 3;
}

// 范围管理者那层（第 2 层）。operatorUserID 要是员工所在企业在职的范围管理者；
// 待确认 1 定了以后换成后台的真实操作人
message AdminScopeDisableAgentReq {
  string agentID = 1;
  ReleaseScope scope = 2; // 这批只能是企业
  string operatorUserID = 3;
  string reason = 4; // 必填，≤200 字
}
message AdminScopeDisableAgentResp {
  string note = 1;
}

message AdminScopeEnableAgentReq {
  string agentID = 1;
  ReleaseScope scope = 2;
  string operatorUserID = 3;
}
message AdminScopeEnableAgentResp {
  bool cleared = 1;
  bool stillDisabled = 2;
  repeated CheckIssue issues = 3;
}

message AdminRestoreAgentReq {
  string agentID = 1;
}
message AdminRestoreAgentResp {
  AgentInfo agent = 1;
  repeated CheckIssue issues = 2;
}

message AuditFilter {
  string companyID = 1;
  string agentID = 2;
  AuditCategory category = 3;
  string action = 4;
  AuditResult result = 5;
  string operatorID = 6;
  int64 startTime = 7; // 毫秒，含
  int64 endTime = 8;   // 毫秒，不含
}

message AdminListAuditsReq {
  AuditFilter filter = 1;
  sdkws.RequestPagination pagination = 2;
}
message AdminListAuditsResp {
  int64 total = 1;
  repeated AuditLog logs = 2;
}

// 最多 1 万条，表格由前端生成
message AdminExportAuditsReq {
  AuditFilter filter = 1;
}
message AdminExportAuditsResp {
  repeated AuditLog logs = 1;
  bool truncated = 2;
}

service Agent {
  // 用户端
  rpc getContext(GetContextReq) returns (GetContextResp);
  rpc createAgent(CreateAgentReq) returns (CreateAgentResp);
  rpc getAgent(GetAgentReq) returns (GetAgentResp);
  rpc listMyAgents(ListMyAgentsReq) returns (ListMyAgentsResp);
  rpc saveDraft(SaveDraftReq) returns (SaveDraftResp);
  rpc restoreDraft(RestoreDraftReq) returns (RestoreDraftResp);
  rpc updateAvatar(UpdateAvatarReq) returns (UpdateAvatarResp);
  rpc deleteAgent(DeleteAgentReq) returns (DeleteAgentResp);
  rpc restoreAgent(RestoreAgentReq) returns (RestoreAgentResp);
  rpc listCapabilities(ListCapabilitiesReq) returns (ListCapabilitiesResp);
  rpc confirmKnowledge(ConfirmKnowledgeReq) returns (ConfirmKnowledgeResp);
  rpc previewRoleImport(PreviewRoleImportReq) returns (PreviewRoleImportResp);
  rpc applyRoleImport(ApplyRoleImportReq) returns (ApplyRoleImportResp);
  rpc testAgent(TestAgentReq) returns (TestAgentResp);
  rpc listTestRuns(ListTestRunsReq) returns (ListTestRunsResp);
  rpc markTestRun(MarkTestRunReq) returns (MarkTestRunResp);
  rpc selfUse(SelfUseReq) returns (SelfUseResp);
  rpc listReleases(ListReleasesReq) returns (ListReleasesResp);
  rpc getSnapshot(GetSnapshotReq) returns (GetSnapshotResp);
  rpc disableRelease(DisableReleaseReq) returns (DisableReleaseResp);
  rpc enableRelease(EnableReleaseReq) returns (EnableReleaseResp);
  rpc submitCheck(SubmitCheckReq) returns (SubmitCheckResp);
  rpc listGrants(ListGrantsReq) returns (ListGrantsResp);
  rpc setEditor(SetEditorReq) returns (SetEditorResp);
  rpc removeEditor(RemoveEditorReq) returns (RemoveEditorResp);
  rpc listGrantedAgents(ListGrantedAgentsReq) returns (ListGrantedAgentsResp);
  rpc listTemplates(ListTemplatesReq) returns (ListTemplatesResp);
  rpc getTemplate(GetTemplateReq) returns (GetTemplateResp);
  rpc listTags(ListTagsReq) returns (ListTagsResp);
  rpc listModelOptions(ListModelOptionsReq) returns (ListModelOptionsResp);
  rpc getEligibility(GetEligibilityReq) returns (GetEligibilityResp);
  rpc listVersions(ListVersionsReq) returns (ListVersionsResp);
  rpc diffVersion(DiffVersionReq) returns (DiffVersionResp);
  rpc submitReview(SubmitReviewReq) returns (SubmitReviewResp);
  rpc withdrawReview(WithdrawReviewReq) returns (WithdrawReviewResp);
  rpc listReviews(ListReviewsReq) returns (ListReviewsResp);
  rpc getReview(GetReviewReq) returns (GetReviewResp);
  rpc retryReview(RetryReviewReq) returns (RetryReviewResp);
  rpc restrictRelease(RestrictReleaseReq) returns (RestrictReleaseResp);

  // 内部（IM 调）
  rpc chat(ChatReq) returns (ChatResp);

  // 平台
  rpc adminGetCompanySetting(AdminGetCompanySettingReq) returns (AdminGetCompanySettingResp);
  rpc adminSetCompanySetting(AdminSetCompanySettingReq) returns (AdminSetCompanySettingResp);
  rpc adminListCompanySettings(AdminListCompanySettingsReq) returns (AdminListCompanySettingsResp);
  rpc adminListModels(AdminListModelsReq) returns (AdminListModelsResp);
  rpc adminSaveModel(AdminSaveModelReq) returns (AdminSaveModelResp);
  rpc adminDeleteModel(AdminDeleteModelReq) returns (AdminDeleteModelResp);
  rpc adminTestModel(AdminTestModelReq) returns (AdminTestModelResp);
  rpc adminListCapabilities(AdminListCapabilitiesReq) returns (AdminListCapabilitiesResp);
  rpc adminListTemplates(AdminListTemplatesReq) returns (AdminListTemplatesResp);
  rpc adminSaveTemplate(AdminSaveTemplateReq) returns (AdminSaveTemplateResp);
  rpc adminDeleteTemplate(AdminDeleteTemplateReq) returns (AdminDeleteTemplateResp);
  rpc adminListTags(AdminListTagsReq) returns (AdminListTagsResp);
  rpc adminSaveTag(AdminSaveTagReq) returns (AdminSaveTagResp);
  rpc adminDeleteTag(AdminDeleteTagReq) returns (AdminDeleteTagResp);
  rpc adminListAgents(AdminListAgentsReq) returns (AdminListAgentsResp);
  rpc adminDisableAgent(AdminDisableAgentReq) returns (AdminDisableAgentResp);
  rpc adminEnableAgent(AdminEnableAgentReq) returns (AdminEnableAgentResp);
  rpc adminScopeDisableAgent(AdminScopeDisableAgentReq) returns (AdminScopeDisableAgentResp);
  rpc adminScopeEnableAgent(AdminScopeEnableAgentReq) returns (AdminScopeEnableAgentResp);
  rpc adminRestoreAgent(AdminRestoreAgentReq) returns (AdminRestoreAgentResp);
  rpc adminListAudits(AdminListAuditsReq) returns (AdminListAuditsResp);
  rpc adminExportAudits(AdminExportAuditsReq) returns (AdminExportAuditsResp);
}
