  string reply = 2;
  repeated ChatSource sources = 3;
  ReleaseScope scope = 4; // 用的版本
  string snapshotID = 5;
  int64 revision = 6;
  int32 unreadable = 7; // 读不到的资料数
  string notice = 8;
  TestMode mode = 9;    // 真实或模拟
  Refusal refusal = 10; // 拒绝时才有
}

